<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumia 1520 Installer</title>
<style>
:root {
  --accent: #0078d7;
  --bg: #000;
  --fg: #fff;
  --sub: #9a9a9a;
  --dim: #5d5d5d;
  --panel: #1f1f1f;
  --dialog: #2b2b2b;
  --button: #333;
  --line: #2d2d2d;
  --ok: #3fb950;
  --warn: #f0a30a;
  --err: #e51400;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body {
  font-family: "Segoe UI", "Selawik", "Segoe WP", "Open Sans", "Noto Sans", "Cantarell", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px; -webkit-font-smoothing: antialiased; overflow: hidden;
  user-select: none;
}
button { font: inherit; color: inherit; }
#app { position: relative; height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }

/* status bar */
.statusbar { height: 26px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: #ddd; flex: none; }
.statusbar .left { display: flex; gap: 8px; align-items: center; }
.signal { display: inline-flex; gap: 2px; align-items: flex-end; height: 11px; }
.signal i { width: 3px; background: #ddd; display: block; }
.signal i.off { background: #555; }
.battery { width: 22px; height: 10px; border: 1px solid #ddd; position: relative; padding: 1px; }
.battery::after { content: ""; position: absolute; right: -3px; top: 2px; width: 2px; height: 4px; background: #ddd; }
.battery b { display: block; height: 100%; width: 80%; background: #ddd; }

/* pages */
.page { position: absolute; inset: 26px 0 0 0; display: flex; flex-direction: column; }
.page.hidden { display: none; }
.page.enter { animation: turnstile .32s cubic-bezier(.1,.9,.2,1); transform-origin: left center; }
@keyframes turnstile { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 24px; scrollbar-width: thin; scrollbar-color: #444 transparent; }
.header { padding: 6px 18px 4px; flex: none; }
.apptitle { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #ddd;
  display: flex; align-items: center; gap: 10px; }
.apptitle svg { width: 22px; height: 22px; color: var(--accent); }
.pagetitle { font-size: 34px; font-weight: 300; margin: 2px 0 10px; letter-spacing: -.01em; line-height: 1.15; text-transform: lowercase; }

/* status tile */
.tile { margin: 4px 18px 10px; background: var(--accent); padding: 12px 14px; display: flex; gap: 14px; align-items: center;
  cursor: pointer; transition: transform .1s; }
.tile:active { transform: scale(.98); }
.tile svg { width: 34px; height: 34px; flex: none; }
.tile .t1 { font-size: 13px; opacity: .85; text-transform: lowercase; }
.tile .t2 { font-size: 19px; font-weight: 400; line-height: 1.2; }
.tile .t3 { font-size: 12px; opacity: .85; margin-top: 2px; }
.tile.problem { background: #a20025; }

/* lists */
.group { font-size: 13px; color: var(--accent); margin: 18px 18px 4px; text-transform: lowercase; font-weight: 600; }
.item { display: flex; align-items: center; gap: 16px; padding: 9px 18px; cursor: pointer; position: relative;
  transition: background .08s, transform .08s; }
.item:hover { background: #141414; }
.item:active { transform: scale(.985); background: #1d1d1d; }
.item .ico { width: 30px; height: 30px; color: var(--accent); flex: none; }
.item .txt { min-width: 0; flex: 1; }
.item .title { font-size: 17px; line-height: 1.25; }
.item .sub { font-size: 13px; color: var(--sub); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .done { font-size: 12px; color: var(--ok); }
.item.disabled { cursor: default; }
.item.disabled .ico, .item.disabled .title { color: var(--dim); }
.item.disabled:hover { background: none; }
.badge { font-size: 11px; padding: 1px 6px; border: 1px solid var(--sub); color: var(--sub); margin-left: 8px; vertical-align: 2px; }
.badge.ok { border-color: var(--ok); color: var(--ok); }

/* task page */
.log { padding: 0 18px; font-size: 14px; }
.ln { padding: 3px 0 3px 22px; position: relative; line-height: 1.35; white-space: pre-wrap; word-break: break-word; user-select: text; }
.ln::before { position: absolute; left: 0; top: 3px; width: 16px; text-align: center; font-weight: 700; }
.ln.step { padding-left: 0; margin-top: 14px; font-size: 20px; font-weight: 300; color: var(--fg); text-transform: lowercase; }
.ln.ok::before { content: "✓"; color: var(--ok); }
.ln.warn { color: #ffd27a; } .ln.warn::before { content: "!"; color: var(--warn); }
.ln.error { color: #ff8a7a; } .ln.error::before { content: "×"; color: var(--err); }
.ln.info { color: #ddd; }
.ln.detail { color: #777; font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; font-size: 12px; padding-left: 22px; display: none; }
.showdetail .ln.detail { display: block; }
.block { margin: 8px 0 8px 0; background: var(--panel); border-left: 3px solid var(--accent); padding: 8px 12px; }
.block h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--sub); text-transform: lowercase; }
.block pre { margin: 0; font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; user-select: text; }
.progress { padding: 8px 18px 0; display: none; }
.progress.on { display: block; }
.bar { height: 4px; background: #333; overflow: hidden; }
.bar b { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.plabel { font-size: 12px; color: var(--sub); margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }
.statusline { font-size: 13px; color: var(--sub); padding: 6px 18px 0; min-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* W10M progress dots */
.dots { position: relative; height: 6px; overflow: hidden; margin: 6px 0 0; display: none; }
.dots.on { display: block; }
.dots i { position: absolute; top: 0; left: -8px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  animation: dot 3.2s infinite cubic-bezier(.2,.6,.8,.4); }
.dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
.dots i:nth-child(4) { animation-delay: .54s; } .dots i:nth-child(5) { animation-delay: .72s; }
@keyframes dot { 0% { left: -8px; opacity: 0; } 10% { opacity: 1; } 35% { left: 45%; } 65% { left: 55%; } 90% { opacity: 1; } 100% { left: 102%; opacity: 0; } }

/* app bar */
.appbar { flex: none; background: var(--panel); display: flex; justify-content: center; gap: 30px; padding: 8px 0 6px; }
.abtn { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; font-size: 11px; color: #ddd; min-width: 64px; }
.abtn .circ { width: 38px; height: 38px; border: 2px solid #ddd; border-radius: 50%; display: grid; place-items: center; }
.abtn svg { width: 18px; height: 18px; }
.abtn:active .circ { background: #ddd; color: #000; }
.abtn.hidden { display: none; }

/* dialog */
.veil { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; z-index: 10; }
.veil.hidden { display: none; }
.dialog { width: 100%; background: var(--dialog); padding: 18px 18px 16px; max-height: 100%; overflow-y: auto;
  animation: drop .25s cubic-bezier(.1,.9,.2,1); }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
.dialog h2 { font-size: 21px; font-weight: 400; margin: 0 0 8px; }
.dialog p { margin: 0 0 12px; color: #ddd; white-space: pre-wrap; line-height: 1.4; user-select: text; }
.dialog .item { padding: 9px 4px; }
.dialog .item .title { font-size: 16px; }
.btns { display: flex; gap: 10px; margin-top: 16px; }
.btn { flex: 1; background: var(--button); border: 2px solid transparent; padding: 7px 10px; cursor: pointer; font-size: 15px; }
.btn:hover { border-color: #666; }
.btn.primary { background: var(--accent); }
.btn.danger { background: #a20025; }
.btn:disabled { opacity: .4; cursor: default; }
.field { margin: 12px 0; }
.field label { display: block; font-size: 15px; }
.field .fsub { font-size: 12px; color: var(--sub); margin-top: 1px; }
input[type=text], input[type=number] { width: 100%; background: #fff; color: #000; border: 2px solid #999; padding: 6px 8px;
  font: inherit; margin-top: 6px; outline: none; user-select: text; }
input[type=text]:focus, input[type=number]:focus { border-color: var(--accent); }
.toggle { display: flex; align-items: center; gap: 12px; margin-top: 6px; cursor: pointer; }
.sw { width: 44px; height: 20px; border: 2px solid #ddd; border-radius: 10px; position: relative; flex: none; transition: background .12s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 4px; width: 10px; height: 10px; border-radius: 50%; background: #ddd; transition: left .12s; }
.toggle.on .sw { background: var(--accent); border-color: var(--accent); }
.toggle.on .sw::after { left: 26px; background: #fff; }
.toggle.disabled { opacity: .4; cursor: default; }
.radio { display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; cursor: pointer; }
.radio .dotr { width: 20px; height: 20px; border: 2px solid #ddd; border-radius: 50%; flex: none; margin-top: 1px; position: relative; }
.radio.on .dotr::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: #fff; }
.radio.on .dotr { border-color: var(--accent); background: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 18px; }
.swatch { width: 52px; height: 52px; cursor: pointer; border: 3px solid transparent; }
.swatch.on { border-color: #fff; }
.about { padding: 0 18px; color: var(--sub); font-size: 13px; line-height: 1.5; user-select: text; }
.about b { color: #ddd; font-weight: 600; }
.req { display: flex; gap: 8px; padding: 2px 18px; font-size: 13px; color: var(--sub); }
.req .k { color: #ddd; min-width: 96px; }
.req .bad { color: var(--warn); }
</style>
</head>
<body>
<div id="app">
  <div class="statusbar"><div class="left"><span class="signal"><i style="height:3px"></i><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i class="off" style="height:11px"></i></span><span id="sbmode"></span></div>
    <div class="left"><span class="battery"><b></b></span><span id="clock"></span></div></div>

  <!-- home -->
  <section class="page" id="home">
    <div class="header"><div class="apptitle"><span id="hicon"></span><span>Lumia 1520 · Android</span></div>
      <div class="pagetitle" data-t="installer">installer</div></div>
    <div class="scroll" id="homelist"></div>
  </section>

  <!-- task -->
  <section class="page hidden" id="task">
    <div class="header"><div class="apptitle"><span>Lumia 1520 · Android</span></div>
      <div class="pagetitle" id="tasktitle"></div></div>
    <div class="progress" id="prog"><div class="bar"><b id="pbar"></b></div><div class="plabel"><span id="plabel"></span><span id="ppct"></span></div></div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="statusline" id="statusline"></div>
    <div class="scroll" id="logscroll"><div class="log" id="log"></div></div>
    <div class="appbar">
      <button class="abtn" id="bStop"><span class="circ" data-icon="stop"></span><span data-t="stop">stop</span></button>
      <button class="abtn" id="bDetail"><span class="circ" data-icon="list"></span><span data-t="details">details</span></button>
      <button class="abtn hidden" id="bBack"><span class="circ" data-icon="back"></span><span data-t="back">back</span></button>
    </div>
  </section>

  <!-- settings -->
  <section class="page hidden" id="settings">
    <div class="header"><div class="apptitle"><span>Lumia 1520 · Android</span></div>
      <div class="pagetitle" data-t="settings">settings</div></div>
    <div class="scroll" id="setlist"></div>
    <div class="appbar"><button class="abtn" id="bSetBack"><span class="circ" data-icon="back"></span><span data-t="back">back</span></button></div>
  </section>

  <div class="veil hidden" id="veil"><div class="dialog" id="dialog"></div></div>
</div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const ICONS = {
  phone: '<rect x="6.5" y="2.5" width="11" height="19" rx="1.2"/><path d="M10.5 18.5h3"/>',
  wizard: '<path d="M4 20 15 9"/><path d="m14 6 1-3 1 3 3 1-3 1-1 3-1-3-3-1z"/><path d="M19 13l.6 1.4L21 15l-1.4.6L19 17l-.6-1.4L17 15l1.4-.6z"/>',
  backup: '<path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4"/><rect x="7.5" y="13" width="9" height="7"/>',
  chip: '<rect x="7" y="7" width="10" height="10"/><path d="M9.5 7V3.5M14.5 7V3.5M9.5 20.5V17M14.5 20.5V17M7 9.5H3.5M7 14.5H3.5M20.5 9.5H17M20.5 14.5H17"/>',
  chain: '<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1.2 1.2"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1.2-1.2"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16.5 9.5"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/>',
  flash: '<path d="M12 3v11"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/><path d="M4 15v5h16v-5"/>',
  restore: '<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/><path d="M12 8v4.5l3 2"/>',
  log: '<path d="M3 12h4l2.5-6 4 12 2.5-6h5"/>',
  tools: '<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3"/><circle cx="12" cy="12" r="6.5"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>',
  memory: '<path d="M4 7h16v10H4z"/><path d="M8 17v3M12 17v3M16 17v3M8 4v3M12 4v3M16 4v3"/>',
  stop: '<rect x="7" y="7" width="10" height="10"/>',
  list: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  back: '<path d="M19 12H5"/><path d="m11 6-6 6 6 6"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  exit: '<path d="M14 4h6v16h-6"/><path d="M10 8l-4 4 4 4M6 12h10"/>',
};
const svg = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ""}</svg>`;

const T = {
  it: { installer: "installer", settings: "impostazioni", stop: "stop", details: "dettagli", back: "indietro",
    phone: "telefono", g_install: "installazione", g_steps: "strumenti avanzati", g_test: "prove con lk1st", g_maint: "manutenzione",
    full: "Completa", full_s: "Windows resta intatto, si ferma a lk1st",
    clean: "Pulita", clean_s: "TWRP, formattazione dei dati e ROM. Arriva con le partizioni Android (fase 2)",
    update: "Aggiornamento", update_s: "TWRP e ROM, dati conservati. Arriva con la prima ROM che si avvia",
    backup: "Backup", backup_s: "GPT, partizioni piccole e immagine completa",
    firmware: "Firmware", firmware_s: "ADSP, Wi-Fi, modem, Venus, ACPI e registro da Windows",
    chain: "Catena di avvio", chain_s: "BootShim + lk1st su EFIESP, voce nel BCD",
    verify: "Verifica lk1st", verify_s: "riavvio, fastboot e log di lk1st",
    boot: "Avvio in RAM", boot_s: "fastboot boot di K1 o di un boot.img della build",
    ramoops: "Log del boot precedente", ramoops_s: "ram console e log di lk1st dopo un blocco",
    flash: "Scrivi partizione", flash_s: "fastboot flash di boot, recovery, system…",
    restore: "Ripristino EFIESP", restore_s: "torna allo stato prima dell'installazione",
    diag: "Diagnostica", diag_s: "USB, fastboot, partizioni, requisiti",
    tools: "Strumenti", tools_s: "fastboot e adb (Platform Tools)",
    settings_s: "lingua, colore, informazioni",
    done_on: "fatto", running: "in corso", lang: "Lingua", accent: "Colore d'accento", about: "Informazioni",
    quit: "Esci", quit_s: "chiude l'installer", req: "Requisiti", work: "Cartella dati",
    ok: "ok", cancel: "annulla", type_word: "Scrivi {w} per confermare", finished: "completato", failed: "interrotto",
    cancelled: "annullato", seen_now: "aggiornato", admin_no: "senza permessi di amministratore",
    next_hint: "prossimo passo: ", all_done: "catena installata e verificata", on: "Attivato", off: "Disattivato",
    bye: "Installer chiuso. Puoi chiudere questa finestra." },
  en: { installer: "installer", settings: "settings", stop: "stop", details: "details", back: "back",
    phone: "phone", g_install: "install", g_steps: "advanced tools", g_test: "tests with lk1st", g_maint: "maintenance",
    full: "Full", full_s: "Windows stays intact, stops at lk1st",
    clean: "Clean", clean_s: "TWRP, format data and ROM. Comes with the Android partitions (phase 2)",
    update: "Update", update_s: "TWRP and ROM, data kept. Comes with the first ROM that boots",
    backup: "Backup", backup_s: "GPT, small partitions and full image",
    firmware: "Firmware", firmware_s: "ADSP, Wi-Fi, modem, Venus, ACPI and registry from Windows",
    chain: "Boot chain", chain_s: "BootShim + lk1st on EFIESP, BCD entry",
    verify: "Check lk1st", verify_s: "restart, fastboot and lk1st log",
    boot: "Boot in RAM", boot_s: "fastboot boot of K1 or a boot.img from the build",
    ramoops: "Previous boot log", ramoops_s: "ram console and lk1st log after a hang",
    flash: "Write partition", flash_s: "fastboot flash of boot, recovery, system…",
    restore: "Restore EFIESP", restore_s: "back to how it was before the install",
    diag: "Diagnostics", diag_s: "USB, fastboot, partitions, requirements",
    tools: "Tools", tools_s: "fastboot and adb (Platform Tools)",
    settings_s: "language, colour, about",
    done_on: "done", running: "running", lang: "Language", accent: "Accent colour", about: "About",
    quit: "Quit", quit_s: "closes the installer", req: "Requirements", work: "Data folder",
    ok: "ok", cancel: "cancel", type_word: "Type {w} to confirm", finished: "finished", failed: "stopped",
    cancelled: "cancelled", seen_now: "updated", admin_no: "without administrator rights",
    next_hint: "next step: ", all_done: "chain installed and checked", on: "On", off: "Off",
    bye: "Installer closed. You can close this window." },
};
const ACCENTS = ["#0078d7", "#0063b1", "#00b7c3", "#008a00", "#60a917", "#e3008c", "#a20025", "#e51400",
                 "#fa6800", "#f0a30a", "#6a00ff", "#aa00ff", "#647687", "#825a2c"];

let S = { lang: "en", phone: {}, done: {}, requirements: [], kit: [] };
let lastEvent = 0, current = "home", taskName = null, polling = false, prompt = null;
const t = (k) => (T[S.lang] || T.en)[k] || k;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const sep = path.includes("?") ? "&" : "?";
  return fetch(path + (body === undefined ? sep + "t=" + encodeURIComponent(TOKEN) : ""), opt).then((r) => r.json());
}

try { const a = localStorage.getItem("accent"); if (a) document.documentElement.style.setProperty("--accent", a); } catch (e) {}

function show(page) {
  for (const p of ["home", "task", "settings"]) {
    const el = $(p);
    if (p === page) { el.classList.remove("hidden"); el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter"); }
    else el.classList.add("hidden");
  }
  current = page;
}

function tick() { const d = new Date(); $("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
setInterval(tick, 10000); tick();

// ---------------------------------------------------------------- home
const ITEMS = [
  ["g_install"], ["full", "wizard"], ["clean", "flash"], ["update", "restore"],
  ["g_steps"], ["backup", "backup"], ["firmware", "chip"], ["chain", "chain"], ["verify", "check"],
  ["g_test"], ["boot", "play"], ["ramoops", "memory"], ["flash", "flash"],
  ["g_maint"], ["restore", "restore"], ["diag", "log"], ["tools", "tools"], ["settings", "gear"],
];
const ORDER = ["backup", "firmware", "chain", "lk1st"];

function fmtDate(s) { return s ? s.replace("T", " ").slice(0, 16) : ""; }

let homeKey = "";
function renderHome(force) {
  const key = JSON.stringify([S.lang, S.phone && [S.phone.mode, S.phone.detail, S.phone.problem], S.done, S.running, S.admin]);
  if (!force && key === homeKey && $("homelist").childElementCount) return;
  homeKey = key;
  $("hicon").innerHTML = svg("phone");
  const ph = S.phone || {};
  const next = ORDER.find((k) => !S.done[k]);
  const nextName = { backup: t("backup"), firmware: t("firmware"), chain: t("chain"), lk1st: t("verify") }[next];
  let h = `<div class="tile ${ph.problem ? "problem" : ""}" data-act="diag">${svg("phone")}<div>
    <div class="t1">${t("phone")}</div><div class="t2">${esc(ph.text || "…")}</div>
    <div class="t3">${esc(ph.problem || ph.detail || (S.admin ? "" : t("admin_no")))}</div></div></div>`;
  for (const [key, icon] of ITEMS) {
    const disabled = S.modes && key in S.modes && !S.modes[key];
    if (!icon) { h += `<div class="group">${t(key)}</div>`; continue; }
    let sub = t(key + "_s");
    const stepKey = key === "verify" ? "lk1st" : key;
    let done = S.done[stepKey] ? `<div class="done">${t("done_on")} ${fmtDate(S.done[stepKey])}</div>` : "";
    if (key === "full") { sub = (next ? t("next_hint") + nextName.toLowerCase() : t("all_done")) + " · " + sub; done = ""; }
    const icoHtml = disabled ? svg("lock") : svg(icon);
    if (S.running === key) done = `<div class="done" style="color:var(--accent)">${t("running")}…</div>`;
    h += `<div class="item ${disabled ? "disabled" : ""}" data-act="${disabled ? "" : key}">
      <div class="ico">${icoHtml}</div><div class="txt"><div class="title">${t(key)}</div><div class="sub">${esc(sub)}</div>${done}</div></div>`;
  }
  $("homelist").innerHTML = h;
  $("sbmode").textContent = ph.mode && ph.mode !== "none" ? ph.mode : "";
}

$("homelist").addEventListener("click", (e) => {
  const it = e.target.closest("[data-act]");
  if (!it || !it.dataset.act) return;
  const a = it.dataset.act;
  if (a === "settings") { renderSettings(); show("settings"); return; }
  startTask(a);
});

function refreshState() {
  return api("/api/state").then((s) => {
    S = s; document.documentElement.lang = s.lang;
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
    if (current === "home") renderHome();
    if (s.running && current !== "task") openTask(s.running, true);
    return s;
  }).catch(() => {});
}
setInterval(() => { if (current !== "task") refreshState(); }, 2000);

// ---------------------------------------------------------------- tasks
function startTask(name) {
  api("/api/run", { action: name }).then((r) => { if (r.ok) openTask(name, false); });
}

function openTask(name, rebuild) {
  taskName = name;
  $("tasktitle").textContent = t(name);
  $("log").innerHTML = ""; $("statusline").textContent = "";
  $("prog").classList.remove("on"); $("dots").classList.add("on");
  $("bStop").classList.remove("hidden"); $("bBack").classList.add("hidden");
  show("task");
  if (rebuild) lastEvent = 0; else lastEvent = Math.max(lastEvent, S.last_event || 0);
  if (!polling) pollEvents();
}

function addLine(kind, text) {
  const d = document.createElement("div");
  d.className = "ln " + kind; d.textContent = text;
  $("log").appendChild(d); scrollLog();
}
function scrollLog() { const s = $("logscroll"); s.scrollTop = s.scrollHeight; }

function handle(ev) {
  switch (ev.type) {
    case "log": addLine(ev.kind, ev.text); break;
    case "block": {
      const b = document.createElement("div"); b.className = "block";
      b.innerHTML = `<h4>${esc(ev.title)}</h4><pre>${esc(ev.lines.join("\n"))}</pre>`;
      $("log").appendChild(b); scrollLog(); break;
    }
    case "progress": {
      $("prog").classList.add("on"); $("statusline").textContent = "";
      if (ev.total) {
        const p = Math.min(100, (ev.done * 100) / ev.total);
        $("pbar").style.width = p + "%"; $("ppct").textContent = p.toFixed(0) + "%";
        if (ev.done >= ev.total) setTimeout(() => $("prog").classList.remove("on"), 600);
      } else { $("pbar").style.width = "100%"; $("ppct").textContent = ""; }
      $("plabel").textContent = ev.label; break;
    }
    case "status": $("statusline").textContent = ev.text; break;
    case "prompt": openPrompt(ev); break;
    case "prompt-closed": if (prompt && prompt.pid === ev.pid) closePrompt(); break;
    case "task":
      if (ev.state === "running") { if (current !== "task") openTask(ev.name, false); break; }
      $("dots").classList.remove("on"); $("statusline").textContent = "";
      $("bStop").classList.add("hidden"); $("bBack").classList.remove("hidden");
      addLine("step", { done: t("finished"), error: t("failed"), cancelled: t("cancelled") }[ev.state] || ev.state);
      closePrompt();
      break;
  }
}

function pollEvents() {
  polling = true;
  api("/api/events?since=" + lastEvent).then((r) => {
    for (const ev of r.events) { lastEvent = Math.max(lastEvent, ev.id); handle(ev); }
    setTimeout(pollEvents, r.events.length ? 0 : 50);
  }).catch(() => setTimeout(pollEvents, 1500));
}

$("bStop").onclick = () => api("/api/cancel", {});
$("bDetail").onclick = () => { $("log").classList.toggle("showdetail"); scrollLog(); };
$("bBack").onclick = () => { refreshState().then(() => { renderHome(); show("home"); }); };

// ---------------------------------------------------------------- dialogs
function openPrompt(p) {
  prompt = p;
  const d = $("dialog");
  let h = `<h2>${esc(p.title)}</h2>` + (p.body ? `<p>${esc(p.body)}</p>` : "");
  if (p.kind === "confirm") {
    if (p.word) h += `<div class="field"><label>${esc(t("type_word").replace("{w}", p.word))}</label><input type="text" id="pword" autocomplete="off" spellcheck="false"></div>`;
    h += `<div class="btns"><button class="btn ${p.danger ? "danger" : "primary"}" id="pyes" ${p.word ? "disabled" : ""}>${esc(p.yes)}</button>
      ${p.no !== null ? `<button class="btn" id="pno">${esc(p.no || t("cancel"))}</button>` : ""}</div>`;
  } else if (p.kind === "choose") {
    for (const o of p.options) {
      h += `<div class="item ${o.disabled ? "disabled" : ""}" data-key="${o.disabled ? "" : o.key}"><div class="txt">
        <div class="title">${esc(o.title)}${o.badge ? `<span class="badge">${esc(o.badge)}</span>` : ""}</div>
        <div class="sub" style="white-space:normal">${esc(o.sub || "")}</div></div></div>`;
    }
    h += `<div class="btns"><button class="btn" id="pno">${t("cancel")}</button></div>`;
  } else if (p.kind === "form") {
    for (const f of p.fields) {
      h += `<div class="field" data-field="${esc(f.key)}">`;
      if (f.type === "toggle") {
        h += `<label>${esc(f.label)}</label>${f.sub ? `<div class="fsub">${esc(f.sub)}</div>` : ""}
          <div class="toggle ${f.value ? "on" : ""} ${f.disabled ? "disabled" : ""}" data-toggle><span class="sw"></span><span class="tv">${f.value ? t("on") : t("off")}</span></div>`;
      } else if (f.type === "select") {
        h += `<label>${esc(f.label)}</label>`;
        for (const o of f.options) h += `<div class="radio ${o.key === f.value ? "on" : ""}" data-radio="${o.key}"><span class="dotr"></span><div><div>${esc(o.title)}</div><div class="fsub">${esc(o.sub || "")}</div></div></div>`;
      } else {
        h += `<label>${esc(f.label)}</label>${f.sub ? `<div class="fsub">${esc(f.sub)}</div>` : ""}
          <input type="${f.type === "number" ? "number" : "text"}" value="${esc(f.value)}" spellcheck="false" autocomplete="off">`;
      }
      h += `</div>`;
    }
    h += `<div class="btns"><button class="btn primary" id="pyes">${esc(p.submit)}</button><button class="btn" id="pno">${t("cancel")}</button></div>`;
  }
  d.innerHTML = h;
  $("veil").classList.remove("hidden");
  const w = $("pword");
  if (w) { w.focus(); w.oninput = () => ($("pyes").disabled = w.value !== p.word); }
  const yes = $("pyes"), no = $("pno");
  if (yes) yes.onclick = () => answer(p.kind === "form" ? collectForm(p) : true);
  if (no) no.onclick = () => answer(p.kind === "confirm" ? false : null);
  d.querySelectorAll("[data-key]").forEach((el) => el.onclick = () => { if (el.dataset.key !== "") answer(Number(el.dataset.key)); });
  d.querySelectorAll("[data-toggle]").forEach((el) => el.onclick = () => {
    if (el.classList.contains("disabled")) return;
    el.classList.toggle("on"); el.querySelector(".tv").textContent = el.classList.contains("on") ? t("on") : t("off");
  });
  d.querySelectorAll("[data-radio]").forEach((el) => el.onclick = () => {
    el.parentElement.querySelectorAll("[data-radio]").forEach((x) => x.classList.remove("on")); el.classList.add("on");
  });
}

function collectForm(p) {
  const out = {};
  for (const f of p.fields) {
    const el = document.querySelector(`[data-field="${CSS.escape(f.key)}"]`);
    if (f.type === "toggle") out[f.key] = el.querySelector("[data-toggle]").classList.contains("on");
    else if (f.type === "select") { const on = el.querySelector(".radio.on"); out[f.key] = on ? Number(on.dataset.radio) : f.value; }
    else if (f.type === "number") out[f.key] = Number(el.querySelector("input").value || 0);
    else out[f.key] = el.querySelector("input").value;
  }
  return out;
}

function answer(value) { if (!prompt) return; api("/api/answer", { pid: prompt.pid, value }); closePrompt(); }
function closePrompt() { prompt = null; $("veil").classList.add("hidden"); $("dialog").innerHTML = ""; }

// ---------------------------------------------------------------- settings
function renderSettings() {
  const cur = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  let h = `<div class="group">${t("lang")}</div>`;
  for (const [k, n] of [["it", "Italiano"], ["en", "English"]])
    h += `<div class="radio ${S.lang === k ? "on" : ""}" data-lang="${k}" style="padding:7px 18px"><span class="dotr"></span><div>${n}</div></div>`;
  h += `<div class="group">${t("accent")}</div><div class="swatches">` +
    ACCENTS.map((c) => `<div class="swatch ${c === cur ? "on" : ""}" data-accent="${c}" style="background:${c}"></div>`).join("") + `</div>`;
  h += `<div class="group">${t("req")}</div>`;
  for (const r of S.requirements) h += `<div class="req"><span class="k">${esc(r.name)}</span><span class="${r.ok ? "" : "bad"}">${r.ok ? "✓ " : "! "}${esc(r.hint || "")}</span></div>`;
  for (const k of S.kit) h += `<div class="req"><span class="k">${esc(k.name)}</span><span class="${k.ok ? "" : "bad"}">${k.ok ? "✓ sha256" : "! sha256"}</span></div>`;
  h += `<div class="req"><span class="k">${t("work")}</span><span>${esc(S.work)}</span></div>`;
  h += `<div class="group">${t("about")}</div><div class="about"><b>bandit-installer ${esc(S.version)}</b> · ${esc(S.platform)}<br>
    BootShim: imbushuo (boot-shim) · lk2nd/lk1st: msm8916-mainline, port KorelisLabs · WPinternals: René Lergner ·
    Android4Lumia950: djokcho, EpicLPer, j0sh1x, sonic011gamer · Markynose · LineageOS</div>`;
  h += `<div class="item" data-quit style="margin-top:14px"><div class="ico">${svg("exit")}</div><div class="txt"><div class="title">${t("quit")}</div><div class="sub">${t("quit_s")}</div></div></div>`;
  $("setlist").innerHTML = h;
  $("setlist").querySelectorAll("[data-lang]").forEach((el) => el.onclick = () =>
    api("/api/lang", { lang: el.dataset.lang }).then(refreshState).then(renderSettings));
  $("setlist").querySelectorAll("[data-accent]").forEach((el) => el.onclick = () => {
    document.documentElement.style.setProperty("--accent", el.dataset.accent);
    try { localStorage.setItem("accent", el.dataset.accent); } catch (e) {}
    renderSettings();
  });
  $("setlist").querySelector("[data-quit]").onclick = () => api("/api/quit", {}).then((r) => {
    if (r.ok) document.body.innerHTML = `<div style="padding:40px 20px;font-size:20px;font-weight:300">${t("bye")}</div>`;
  });
}
$("bSetBack").onclick = () => { renderHome(); show("home"); };

document.querySelectorAll("[data-icon]").forEach((el) => (el.innerHTML = svg(el.dataset.icon)));
refreshState().then((s) => { if (s && s.prompt && s.running) { openTask(s.running, true); } });
</script>
</body>
